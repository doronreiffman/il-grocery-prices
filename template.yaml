AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Collects, every morning, the price files five Israeli supermarket chains publish under the food-competition law, and, while its polls are switched on, four of the chains' update files through the day, into a write-once S3 bucket.

Parameters:
  UserAgent:
    Type: String
    Description: Names the project and a contact, e.g. "il-grocery-prices/0.1.0 (+https://github.com/you/il-grocery-prices; you@example.org)"
    # Must carry a +https:// project URL and an email, or the deploy is refused (the code refuses it
    # too). A value with spaces must be inner-quoted on the sam deploy command line or it is
    # silently cut at the first space.
    AllowedPattern: '.*\+https://.*@.*'
    ConstraintDescription: must contain "+https://<project url>" and a contact email address
  AlertEmail:
    Type: String
    Description: Gets an email when a morning is incomplete after the retry run, a chain is stopped, or a run failed.
  HealthcheckUrl:
    Type: String
    NoEcho: true
    Description: healthchecks.io ping URL, e.g. https://hc-ping.com/<uuid>; the morning check pings it.
    AllowedPattern: 'https://hc-ping\.com/[-A-Za-z0-9_/]+'
    ConstraintDescription: must be a healthchecks.io ping URL, https://hc-ping.com/...
  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Start DISABLED to test the stack with manual runs; redeploy with ENABLED to go live.
  PollScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: The update-file polls through the day, and the next morning's check of them, on or off apart from the morning's runs; start DISABLED and run each chain's poll by hand first.
  SiteBucketName:
    Type: String
    Description: The site stack's bucket (its output SiteBucketName), where the basket run puts the pages and day files.
    # The code refuses any other name too (basket.handler.SITE_BUCKET_PREFIX), so the archive bucket is
    # never taken for the site's.
    AllowedPattern: 'il-grocery-prices-site-sitebucket-.+'
    ConstraintDescription: must be the site stack's bucket, il-grocery-prices-site-sitebucket-...
  SiteDistributionId:
    Type: String
    Description: The site stack's CloudFront distribution (its output SiteDistributionId), invalidated after an upload.
    AllowedPattern: 'E[A-Z0-9]+'
    ConstraintDescription: must be a CloudFront distribution id, E and then capital letters and digits
  BasketHealthcheckUrl:
    Type: String
    NoEcho: true
    Description: healthchecks.io ping URL of the basket run's own check, e.g. https://hc-ping.com/<uuid>
    AllowedPattern: 'https://hc-ping\.com/[-A-Za-z0-9_/]+'
    ConstraintDescription: must be a healthchecks.io ping URL, https://hc-ping.com/...
  BasketScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: The basket's six schedules, on or off apart from the collector's; start DISABLED and run the basket by hand first.

Resources:
  ArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # No default retention: the code locks each raw file, manifest and check record for ten
      # years (governance mode) as it writes it, so the state files stay plain, rewritable puts.
      ObjectLockEnabled: true
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: collector.handler.handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 512
      # Lambda's longest run: Shufersal's price files take most of it. A run stops downloading
      # with under 90 s left and records the rest as not attempted.
      Timeout: 900
      # Scheduler invokes asynchronously; Lambda would otherwise run a failed invocation twice more.
      # The retry run three hours later is the real retry.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      LoggingConfig:
        LogGroup: !Ref CollectorLogs
      Environment:
        Variables:
          BUCKET: !Ref ArchiveBucket
          USER_AGENT: !Ref UserAgent
          ALERT_TOPIC_ARN: !Ref AlertTopic
          HEALTHCHECK_URL: !Ref HealthcheckUrl
          RETENTION_DAYS: "3650"
          POLL_SCHEDULE_STATE: !Ref PollScheduleState
      Policies:
        - Statement:
            # Raw files, manifests and check records: written once and locked. Each put sets its
            # own retain-until date, and S3 requires s3:PutObjectRetention to place a retention
            # configuration on an object (flights-archive's role grants the same pair).
            - Sid: WriteOnceLocked
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectRetention
              Resource:
                - !Sub "${ArchiveBucket.Arn}/raw/*"
                - !Sub "${ArchiveBucket.Arn}/manifests/*"
                - !Sub "${ArchiveBucket.Arn}/checks/*"
            # The check reads manifests and store lists; a taken key is compared through
            # head_object, which needs s3:GetObject.
            - Sid: ReadStored
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub "${ArchiveBucket.Arn}/raw/*"
                - !Sub "${ArchiveBucket.Arn}/manifests/*"
                - !Sub "${ArchiveBucket.Arn}/checks/*"
            # Each chain's stopped latch: plain JSON, read and rewritten.
            - Sid: ReadWriteState
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "${ArchiveBucket.Arn}/state/*"
            # Lists a day's stored files; without it, S3 answers a missing state file with 403
            # instead of 404.
            - Sid: ListBucketSoMissingKeyIs404
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt ArchiveBucket.Arn
            - Sid: EmailAlerts
              Effect: Allow
              Action: sns:Publish
              Resource: !Ref AlertTopic
      # Israel time, so daylight saving needs no handling. Shufersal's invocations start 15 minutes
      # apart (Lambda's longest run), so one chain never gets two requests at once, and the three NCR
      # chains' start at least 15 minutes apart (ruling R30: they share url.publishedprices.co.il), so
      # their sessions never overlap. Shufersal collects its store list and full files only, one kind an
      # invocation, each full kind twice in the morning, the second run carrying on where the first
      # stopped (owner, 2026-11-01). A retry run starts three hours after the first main run of its
      # kinds; the check starts at 11:48, 15 minutes after the last retry run (Osher Ad's, 11:18) can
      # have finished, for its manifest write and the schedulers' lag. No flexible window and no
      # Scheduler retries.
      # The update-file polls (docs/update-files.md, section 2) read the update kinds only (Price and Promo), through
      # the day, on a switch of their own, PollScheduleState: every two hours from 12:20 and once more at 23:20, the
      # three NCR chains 15 minutes apart on their shared host and Carrefour after them. None is in flight while the
      # basket's extractions run (12:03 to 12:18): the design's concurrency spacing, written when the account's Lambda
      # quota in il-central-1 read 5, kept as approved though the quota read 400 on 2026-11-07 (aws lambda
      # get-account-settings). Shufersal's passes come later (docs/update-files.md, section 7).
      Events:
        MainShufersalStores:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(30 6 * * ? *)"
            ScheduleExpressionTimezone: Asia/Jerusalem
            Input: '{"mode": "main", "chain": "shufersal", "kinds": ["Stores"]}'
            State: !Ref ScheduleState
            FlexibleTimeWindow: {Mode: "OFF"}
            RetryPolicy: {MaximumRetryAttempts: 0}
        MainRamiLevy:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(33 6 * * ? *)"
            ScheduleExpressionTimezone: Asia/Jerusalem
            Input: '{"mode": "main", "chain": "ramilevy"}'
            State: !Ref ScheduleState
            FlexibleTimeWindow: {Mode: "OFF"}
            RetryPolicy: {MaximumRetryAttempts: 0}
        MainCarrefour:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(39 6 * * ? *)"
            ScheduleExpressionTimezone: Asia/Jerusalem
            Input: '{"mode": "main", "chain": "carrefour"}'
            State: !Ref ScheduleState
            FlexibleTimeWindow: {Mode: "OFF"}
            RetryPolicy: {MaximumRetryAttempts: 0}
        MainShufersalPrices:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(45 6 * * ? *)"
            ScheduleExpressionTimezone: Asia/Jerusalem
            Input: '{"mode": "main", "chain": "shufersal", "kinds": ["PriceFull"]}'
            State: !Ref ScheduleState
            FlexibleTimeWindow: {Mode: "OFF"}
            RetryPolicy: {MaximumRetryAttempts: 0}
        MainOsherAd:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(18 8 * * ? *)"
            ScheduleExpressionTimezone: Asia/Jerusalem
            Input: '{"mode": "main", "chain": "osherad"}'
            State: !Ref ScheduleState
            FlexibleTimeWindow: {Mode: "OFF"}
            RetryPolicy: {MaximumRetryAttempts: 0}
        MainShufersalPricesAgain:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 7 * * ? *)"
            ScheduleExpressionTimezone: Asia/Jerusalem
            Input: '{"mode": "main", "chain": "shufersal", "kinds": ["PriceFull"]}'
            State: !Ref ScheduleState
            FlexibleTimeWindow: {Mode: "OFF"}
            RetryPolicy: {MaximumRetryAttempts: 0}
        MainYochananof:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(3 7 * * ? *)"
            ScheduleExpressionTimezone: Asia/Jerusalem
            Input: '{"mode": "main", "chain": "yochananof"}'
            State: !Ref ScheduleState
            FlexibleTimeWindow: {Mode: "OFF"}
            RetryPolicy: {MaximumRetryAttempts: 0}
        MainShufersalPromos:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(15 7 * * ? *)"
            ScheduleExpressionTimezone: Asia/Jerusalem
            Input: '{"mode": "main", "chain": "shufersal", "kinds": ["PromoFull"]}'
            State: !Ref ScheduleState
            FlexibleTimeWindow: {Mode: "OFF"}
            RetryPolicy: {MaximumRetryAttempts: 0}
        MainShufersalPromosAgain:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(30 7 * * ? *)"
            ScheduleExpressionTimezone: Asia/Jerusalem
            Input: '{"mode": "main", "chain": "shufersal", "kinds": ["PromoFull"]}'
