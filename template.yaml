  # Created before the function, under its own name, so the first run can't race CloudFormation
  # by creating /aws/lambda/<name> with no retention.
  CollectorLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/collector"
      RetentionInDays: 30

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  BasketFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: basket.handler.handler
      Runtime: python3.13
      Architectures: [arm64]
      # Left alone, DuckDB takes 80% of what it reads as the machine's memory, not the function's;
      # DUCKDB_MEMORY_LIMIT below holds it under the function's memory (src/basket/duck.py). 3,008 MB
      # from store first's deploy (2,048 before): the site run's memory grows with its 91 days of history
      # (docs/operations.md, "Sizing").
      MemorySize: 3008
      # Lambda's longest run; the schedules below are spaced by it.
      Timeout: 900
      # /tmp holds an extraction's files of the day, its tables and DuckDB's spill folder, and the site
      # run's 91 days of items tables, its pages and the day's prices tables: the site run's need is not
      # measured yet, so the room is ample (docs/operations.md, "Sizing").
      EphemeralStorage: {Size: 10240}
      # DuckDB, built by sam build from layer/; the function's own zip is src/ alone, so the record's
      # code fingerprint is the one computed on the Mac.
      Layers: [!Ref DuckDbLayer]
      # Scheduler invokes asynchronously; Lambda would otherwise run a failed invocation twice more.
      # The basket run's /fail ping is the alert, and a rerun is by hand.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      LoggingConfig:
        LogGroup: !Ref BasketLogs
      Environment:
        Variables:
          BUCKET: !Ref ArchiveBucket
          SITE_BUCKET: !Ref SiteBucketName
          DISTRIBUTION_ID: !Ref SiteDistributionId
          HEALTHCHECK_URL: !Ref BasketHealthcheckUrl
          USER_AGENT: !Ref UserAgent
          RETENTION_DAYS: "3650"
          # Lambda's working directory, where DuckDB would put its temp folder, is read-only.
          DUCKDB_TEMP_DIRECTORY: /tmp/duckdb
          DUCKDB_MEMORY_LIMIT: 1200MB
      Policies:
        - Statement:
            # The extractions read the day's price files and the basket run the tables, the store
            # lists and the manifests. Both look for the day's check record first by listing checks/,
            # which ListArchive covers; no check record is read. A locked put of a record that S3
            # refuses is compared through head_object, which needs s3:GetObject. The freezer reads a
            # stored forecasts or scores file back, and its time, to say whether a new file is the
            # same, so those two folders are read here as well. tables/ holds every kind of table,
            # the shopper site's items, covered and scored ones included, so it takes no new line.
            - Sid: ReadArchive
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub "${ArchiveBucket.Arn}/raw/*"
                - !Sub "${ArchiveBucket.Arn}/manifests/*"
                - !Sub "${ArchiveBucket.Arn}/tables/*"
                - !Sub "${ArchiveBucket.Arn}/basket/*"
                - !Sub "${ArchiveBucket.Arn}/forecasts/*"
                - !Sub "${ArchiveBucket.Arn}/scores/*"
            # Each chain's table and report of the day: plain puts, replacing an earlier run's.
            - Sid: WriteTables
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${ArchiveBucket.Arn}/tables/*"
            # The basket run's records, and the shopper site's day of forecasts and day of scores:
            # written once and locked, each put setting its own retain-until date, which needs
            # s3:PutObjectRetention, as the collector's locked writes do. A forecast is only worth
            # scoring if it cannot be replaced after the day it forecasts.
            - Sid: WriteOnceLockedRecords
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectRetention
              Resource:
                - !Sub "${ArchiveBucket.Arn}/basket/*"
                - !Sub "${ArchiveBucket.Arn}/forecasts/*"
                - !Sub "${ArchiveBucket.Arn}/scores/*"
            # Lists a day's files and the check records; without it, S3 answers a missing table with
            # 403 instead of 404.
            - Sid: ListArchive
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt ArchiveBucket.Arn
            # The site's published copy of the day, which the run's numbers are compared with, and
            # the published files the guard checks a new upload against: the shopper site's day
            # files, its forecasts and ledger, and its scores.
            - Sid: ReadPublished
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub "arn:aws:s3:::${SiteBucketName}/days/*"
                - !Sub "arn:aws:s3:::${SiteBucketName}/site-days/*"
                - !Sub "arn:aws:s3:::${SiteBucketName}/forecasts/*"
                - !Sub "arn:aws:s3:::${SiteBucketName}/scores/*"
            # What the build puts up and nothing else in the site bucket: the five fixed pages (named
            # one by one), the product, browse, search and store files under their folders (store/
            # holds the store types' front pages), and the day files, forecasts, ledger and scores.
            # Put, never delete: a page the build no longer writes stays, and the site bucket's
            # lifecycle rule expires only old versions of the pages a morning rebuilds.
            - Sid: WriteSite
              Effect: Allow
              Action: s3:PutObject
              Resource:
                - !Sub "arn:aws:s3:::${SiteBucketName}/index.html"
                - !Sub "arn:aws:s3:::${SiteBucketName}/method.html"
                - !Sub "arn:aws:s3:::${SiteBucketName}/record.html"
                - !Sub "arn:aws:s3:::${SiteBucketName}/basket.html"
                - !Sub "arn:aws:s3:::${SiteBucketName}/search.js"
                - !Sub "arn:aws:s3:::${SiteBucketName}/p/*"
                - !Sub "arn:aws:s3:::${SiteBucketName}/browse/*"
                - !Sub "arn:aws:s3:::${SiteBucketName}/search/*"
                - !Sub "arn:aws:s3:::${SiteBucketName}/store/*"
                - !Sub "arn:aws:s3:::${SiteBucketName}/days/*"
                - !Sub "arn:aws:s3:::${SiteBucketName}/site-days/*"
                - !Sub "arn:aws:s3:::${SiteBucketName}/forecasts/*"
                - !Sub "arn:aws:s3:::${SiteBucketName}/scores/*"
            # Finds the site's latest day; without it, S3 answers a day not yet published with 403
            # instead of 404.
            - Sid: ListSite
              Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub "arn:aws:s3:::${SiteBucketName}"
            # One invalidation after an upload, of the site's distribution only.
            - Sid: Invalidate
              Effect: Allow
              Action: cloudfront:CreateInvalidation
              Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistributionId}"
      # Israel time, as the collector's. The extractions read the archive bucket only and touch no
      # portal, so the five share a minute. They start 15 minutes after the collector's check, by when
      # it can have finished (Lambda's longest run), and the basket run 30 minutes after them: 15
      # minutes after the last extraction can have finished, for its table's put and the schedulers'
      # lag. Neither mode runs on a day without the check's record, so a late check fails the run
      # rather than building on a partial morning. The switch is the basket's own, so the collector
      # keeps running while step two is tested. No flexible window and no Scheduler retries.
      Events:
        ExtractShufersal:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(3 12 * * ? *)"
            ScheduleExpressionTimezone: Asia/Jerusalem
            Input: '{"mode": "extract", "chain": "shufersal"}'
            State: !Ref BasketScheduleState
            FlexibleTimeWindow: {Mode: "OFF"}
            RetryPolicy: {MaximumRetryAttempts: 0}
        ExtractRamiLevy:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(3 12 * * ? *)"
            ScheduleExpressionTimezone: Asia/Jerusalem
            Input: '{"mode": "extract", "chain": "ramilevy"}'
            State: !Ref BasketScheduleState
            FlexibleTimeWindow: {Mode: "OFF"}
            RetryPolicy: {MaximumRetryAttempts: 0}
        ExtractOsherAd:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(3 12 * * ? *)"
            ScheduleExpressionTimezone: Asia/Jerusalem
            Input: '{"mode": "extract", "chain": "osherad"}'
            State: !Ref BasketScheduleState
            FlexibleTimeWindow: {Mode: "OFF"}
            RetryPolicy: {MaximumRetryAttempts: 0}
        ExtractCarrefour:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(3 12 * * ? *)"
            ScheduleExpressionTimezone: Asia/Jerusalem
            Input: '{"mode": "extract", "chain": "carrefour"}'
            State: !Ref BasketScheduleState
            FlexibleTimeWindow: {Mode: "OFF"}
            RetryPolicy: {MaximumRetryAttempts: 0}
        ExtractYochananof:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(3 12 * * ? *)"
            ScheduleExpressionTimezone: Asia/Jerusalem
            Input: '{"mode": "extract", "chain": "yochananof"}'
            State: !Ref BasketScheduleState
            FlexibleTimeWindow: {Mode: "OFF"}
            RetryPolicy: {MaximumRetryAttempts: 0}
        Basket:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(33 12 * * ? *)"
            ScheduleExpressionTimezone: Asia/Jerusalem
            Input: '{"mode": "basket", "collected_by": "12:03"}'
            State: !Ref BasketScheduleState
            FlexibleTimeWindow: {Mode: "OFF"}
            RetryPolicy: {MaximumRetryAttempts: 0}
  # Created before the function, as the collector's is, so the first run can't create
  # /aws/lambda/<name> with no retention.
  BasketLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/basket"
      RetentionInDays: 30

  # DuckDB for the basket function: sam build runs the target build-DuckDbLayer of layer/Makefile,
  # which installs the hash-pinned wheel for Lambda's arm64 Linux.
  DuckDbLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layer/
      CompatibleRuntimes: [python3.13]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: makefile
      BuildArchitecture: arm64

Outputs:
  ArchiveBucketName:
    Value: !Ref ArchiveBucket
  CollectorFunctionName:
    Value: !Ref CollectorFunction
  BasketFunctionName:
    Value: !Ref BasketFunction
