name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      # Node is for the behaviour tests of search.js only. 22.11.0 was released on 2024-10-29 (nodejs.org/dist/index.json)
      - uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
      - run: pytest --cov=collector --cov=src/basket --cov=src/shopper --cov-fail-under=95
      # The full mutation check runs weekly (mutations.yml); every push checks only that each planted bug's text is
      # still found exactly once in its file, so a renamed or moved line cannot leave a mutation silently stale.
      - name: Mutation check, staleness only
        run: |
          python -I -c "import importlib.util as u, sys; s = u.spec_from_file_location('m', 'scripts/mutation_check.py'); m = u.module_from_spec(s); s.loader.exec_module(m); bad = [n for n, ((f, _), old, _) in m.MUTATIONS.items() if (m.ROOT / f).read_text().count(old) != 1]; print(len(m.MUTATIONS), 'mutations;', bad or 'none stale'); sys.exit(1 if bad else 0)"
      - run: cfn-lint --regions il-central-1 -- template.yaml site-template.yaml
