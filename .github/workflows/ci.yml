name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      # Node is for the behaviour tests of search.js only. 22.11.0 was released on 2024-10-29 (nodejs.org/dist/index.json)
      - uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
      # dbt is for the dbt layer's tests only, in an environment of its own (docs/dbt-layer.md, section 6). Each fresh
      # install fetches one wheel from GitHub: dbt-core-experimental-parser's, from dbt's release v2.0.8, checked against
      # the SHA-256 the package carries; packaging goes in first so the build needs nothing unpinned.
      - run: python -m venv .venv-dbt
      - run: .venv-dbt/bin/pip install --no-deps packaging==26.3 && .venv-dbt/bin/pip install --no-deps --no-build-isolation -r requirements-dbt.txt && .venv-dbt/bin/pip check
      - run: pytest --cov=collector --cov=src/basket --cov=src/shopper --cov-fail-under=95
      # The full mutation check runs weekly (mutations.yml); tests/test_mutation_targets.py, run with the tests above,
      # checks on every push that each planted bug still finds its text, exactly once, and the tests it names.
      - run: cfn-lint --regions il-central-1 -- template.yaml site-template.yaml
