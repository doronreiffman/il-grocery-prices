name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      # Node is for the behaviour tests of search.js only. 22.11.0 was released on 2024-10-29 (nodejs.org/dist/index.json)
      - uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
      - run: pytest --cov=collector --cov=src/basket --cov=src/shopper --cov-fail-under=95
      # The full mutation check runs weekly (mutations.yml); tests/test_mutation_targets.py, run with the tests above,
      # checks on every push that each planted bug still points at real code and real tests.
      - run: cfn-lint --regions il-central-1 -- template.yaml site-template.yaml
