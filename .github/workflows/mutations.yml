name: Mutation check

# The full mutation check: every planted bug in scripts/mutation_check.py, each expected to fail a test. Its last full run took
# 1 h 51 min on a Mac (2,338 mutations, 2026-11-09), so it is scheduled weekly on main (Saturday 03:00 UTC) and runs on demand from
# the Actions tab, not on every push (owner, 2026-11-09). Every push still runs the tests, with
# tests/test_mutation_targets.py (ci.yml).

on:
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      # Node is for the behaviour tests of search.js only, as in ci.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
      # The tests first, unchanged: the check counts any failing test as a caught mutation, so a suite that fails on its own
      # (a new Python patch release, an unpinned dependency) would pass every mutation aimed at it.
      - run: pytest --cov=collector --cov=src/basket --cov=src/shopper --cov-fail-under=95
      - run: python scripts/mutation_check.py
